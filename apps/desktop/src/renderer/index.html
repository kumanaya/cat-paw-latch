<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Strict CSP: no remote content, no inline event handlers; only our own
         script/style files. This is a security surface (DESIGN.md §13.2). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="switch.css" />
    <!-- The Vault tab, from Mary's design. Scoped to that pane; nothing else
         on any screen changes. -->
    <link rel="stylesheet" href="vault.css" />
    <title>Plow Latch</title>
  </head>
  <body>
    <div class="app">
      <!-- The window is frameless on every platform, so the drag region and
           the place macOS puts its traffic lights are ours to lay out. -->
      <nav class="sidebar app-chrome" aria-label="Sections">
        <div class="sidebar-top" aria-hidden="true"></div>
        <div class="sidebar-brand" aria-hidden="true">
          <span class="brand-name">Plow Latch</span>
        </div>
        <!-- First, and a place rather than an action: Agents is what has access
             to this Mac. The tab this replaces was called "Connect a client",
             and a setup verb made an odd permanent home; giving something
             access is one thing you do here, and the roster of what already has
             it belongs in the same pane once the app can ask for it.

             The glyphs are the same line art dom.js draws, at nav weight. -->
        <div class="seg" id="seg" role="tablist" aria-label="Sections">
          <button data-tab="agents" role="tab" aria-selected="false">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h16v12H4z" />
              <path d="M12 8V4" />
            </svg>
            <span>Agents</span>
          </button>
          <button data-tab="audit" class="active" role="tab" aria-selected="true">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Audit</span>
          </button>
          <button data-tab="vault" role="tab" aria-selected="false">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="8" cy="15" r="4" />
              <path d="M10.8 12.2L20 3" />
              <path d="M17 6l2.5 2.5" />
              <path d="M15 8l2.5 2.5" />
            </svg>
            <span>Browser Vault</span>
          </button>
          <!-- What is stopping this Mac's agents (pluginsModel.ts); the full
               permission inventory lives in Settings. -->
          <button data-tab="plugins" role="tab" aria-selected="false">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7h14M5 12h14M5 17h14" />
              <circle cx="9" cy="7" r="2.1" />
              <circle cx="15" cy="12" r="2.1" />
              <circle cx="8" cy="17" r="2.1" />
            </svg>
            <span>Plugins</span>
          </button>
          <button data-tab="settings" role="tab" aria-selected="false">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.2" />
              <circle cx="12" cy="12" r="2.6" />
              <path d="M12 2.4v2.8M12 18.8v2.8M2.4 12h2.8M18.8 12h2.8" />
              <path d="M5.2 5.2l2 2M16.8 16.8l2 2M18.8 5.2l-2 2M7.2 16.8l-2 2" />
            </svg>
            <span>Settings</span>
          </button>
        </div>
        <div class="sidebar-foot">
          <span class="status-dot" id="statusDot"></span>
          <span class="sidebar-status" id="statusText">…</span>
        </div>
      </nav>

      <main class="workspace app-chrome">
        <header class="workspace-head">
          <h1 class="page-title" id="sectionTitle">Audit</h1>
        </header>
        <!-- Passive update notice: shown only when an update is staged and not
             dismissed (main.js drives it from updates:get). Never modal. -->
        <div id="updateBanner" class="update-banner" hidden></div>
        <div id="gatekeeperNotice" class="gatekeeper-notice" hidden></div>
        <div id="view"></div>
      </main>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
